<script>
/* =========================================================================
   SUPABASE YAPILANDIRMASI — kendi proje bilgilerinle değiştir
   Project Settings > Data API içinden Project URL ve anon public key'i kopyala.
   ========================================================================= */
const SUPABASE_URL = "https://ysflkkppwlxvnqjlvoar.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_MC9GRkRDY1iOTgAsDosp5A_Ls4bBF2q";

/* =========================================================================
   VERİ ERİŞİM KATMANI (DB) — İLERİDE KENDİ SUNUCUNA GEÇERKEN SADECE BURASI
   VE HEMEN ALTINDAKİ fetch SARMALAYICILARI DEĞİŞİR. Arayüz kodu hep DB.*
   fonksiyonlarını çağırır, hiçbir yerde doğrudan Supabase URL'i geçmez.
   Supabase SDK'sı KULLANILMIYOR — sade fetch() ile REST API'ye konuşuyoruz,
   böylece harici bir script/CDN bağımlılığı da yok.
   ========================================================================= */
let session = null; // { access_token, refresh_token, user }

async function authRequest(path, body) {
  const res = await fetch(SUPABASE_URL + '/auth/v1' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw data;
  return data;
}
function signUp(email, password) { return authRequest('/signup', { email, password }); }
function signIn(email, password) { return authRequest('/token?grant_type=password', { email, password }); }
const REMEMBER_KEY = 'hazine-refresh-token';
function saveRememberedToken(token) {
  try { localStorage.setItem(REMEMBER_KEY, token); } catch (err) { /* önemli değil */ }
}
function clearRememberedToken() {
  try { localStorage.removeItem(REMEMBER_KEY); } catch (err) { /* önemli değil */ }
}
function getRememberedToken() {
  try { return localStorage.getItem(REMEMBER_KEY); } catch (err) { return null; }
}
async function refreshSessionToken() {
  if (!session || !session.refresh_token) throw new Error('no refresh token');
  const data = await authRequest('/token?grant_type=refresh_token', { refresh_token: session.refresh_token });
  session = data;
  return data;
}
async function signOutRemote() {
  if (!session) return;
  try {
    await fetch(SUPABASE_URL + '/auth/v1/logout', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token },
    });
  } catch (err) { /* önemli değil */ }
}
async function updatePassword(newPassword) {
  const res = await fetch(SUPABASE_URL + '/auth/v1/user', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify({ password: newPassword }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw data;
  return data;
}

async function restRequest(method, path, body, extraHeaders) {
  function headersNow() {
    return Object.assign({
      apikey: SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + (session ? session.access_token : ''),
      'Content-Type': 'application/json',
    }, extraHeaders || {});
  }
  let res = await fetch(SUPABASE_URL + '/rest/v1' + path, {
    method: method, headers: headersNow(), body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 && session && session.refresh_token) {
    try {
      await refreshSessionToken();
      res = await fetch(SUPABASE_URL + '/rest/v1' + path, {
        method: method, headers: headersNow(), body: body !== undefined ? JSON.stringify(body) : undefined,
      });
    } catch (err) { /* yenileme başarısız oldu, aşağıdaki hata yönetimine düşer */ }
  }
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error('REST hata ' + res.status + ': ' + errText);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const LIST_ITEM_COLS = 'id,name,description,box_id,created_at,photo_mime,quantity,tags';
const DETAIL_ITEM_COLS = 'id,name,description,box_id,created_at,photo,photo_mime,quantity,tags';

const DB = {
  listBoxes() { return restRequest('GET', '/boxes?select=id,name,color_idx,created_at&order=name.asc'); },
  listItems() { return restRequest('GET', '/items?select=' + LIST_ITEM_COLS + '&order=created_at.desc'); },
  async getItemWithPhoto(id) {
    const rows = await restRequest('GET', '/items?select=' + DETAIL_ITEM_COLS + '&id=eq.' + id);
    return rows && rows[0] ? rows[0] : null;
  },
  async addBox(name, colorIdx) {
    const rows = await restRequest('POST', '/boxes', [{ name: name, color_idx: colorIdx }], { Prefer: 'return=representation' });
    return rows[0];
  },
  deleteBox(id) { return restRequest('DELETE', '/boxes?id=eq.' + id); },
  async updateBox(id, name) {
    const rows = await restRequest('PATCH', '/boxes?id=eq.' + id, { name: name }, { Prefer: 'return=representation' });
    return rows[0];
  },
  async addItem(data) {
    const rows = await restRequest('POST', '/items?select=' + LIST_ITEM_COLS, [data], { Prefer: 'return=representation' });
    return rows[0];
  },
  async updateItem(id, data) {
    const rows = await restRequest('PATCH', '/items?id=eq.' + id + '&select=' + LIST_ITEM_COLS, data, { Prefer: 'return=representation' });
    return rows[0];
  },
  deleteItem(id) { return restRequest('DELETE', '/items?id=eq.' + id); },
};

/* ================= BYTEA <-> BINARY YARDIMCILARI ================= */

function bytesToHexPg(bytes) {
  const parts = new Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) parts[i] = bytes[i].toString(16).padStart(2, '0');
  return '\\x' + parts.join('');
}
function hexPgToBytes(pgHex) {
  const clean = pgHex.indexOf('\\x') === 0 ? pgHex.slice(2) : pgHex;
  const len = Math.floor(clean.length / 2);
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = parseInt(clean.slice(i * 2, i * 2 + 2), 16);
  return bytes;
}
function bytesToBase64(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function base64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* ================= FOTOĞRAF SIKIŞTIRMA (max 800px, ~120KB hedef) ================= */

async function compressImageForUpload(file) {
  const MAX_DIM = 800, TARGET_BYTES = 120 * 1024;
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('Dosya okunamadı'));
    reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error('Görsel yüklenemedi'));
    im.src = dataUrl;
  });
  let width = img.width, height = img.height;
  if (width > height && width > MAX_DIM) { height = Math.round(height * MAX_DIM / width); width = MAX_DIM; }
  else if (height >= width && height > MAX_DIM) { width = Math.round(width * MAX_DIM / height); height = MAX_DIM; }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  const tryEncode = (mime, quality) => new Promise(resolve => canvas.toBlob(b => resolve(b), mime, quality));

  let blob = await tryEncode('image/webp', 0.82);
  let mime = 'image/webp';
  if (!blob || blob.type !== 'image/webp') { blob = await tryEncode('image/jpeg', 0.82); mime = 'image/jpeg'; }
  let quality = 0.82;
  while (blob && blob.size > TARGET_BYTES && quality > 0.35) {
    quality -= 0.1;
    blob = await tryEncode(mime, quality);
  }
  const bytes = new Uint8Array(await blob.arrayBuffer());
  return { bytes: bytes, mime: mime, previewUrl: URL.createObjectURL(blob), size: blob.size };
}

  return '<div class="tag-filter-row">' + tags.map((t, idx) =>

  ).join('') + '</div>';

function toggleTagFilterAt(idx) {
  const tags = getAllTags();
  const t = tags[idx];
  state.activeTagFilter = (state.activeTagFilter === t) ? null : t;
  const filterEl = document.getElementById('tag-filter-row-container');
  if (filterEl) filterEl.innerHTML = renderTagFilterRow();
  const resultsEl = document.getElementById('search-results');
  if (resultsEl) resultsEl.innerHTML = computeSearchResultsHtml();
}
function computeSearchResultsHtml() {
  const q = currentQuery.trim().toLocaleLowerCase('tr');
  const hasTagFilter = !!state.activeTagFilter;
  if (!q && !hasTagFilter) {
    if (state.items.length === 0) return renderEmptyState('box', 'Henüz parça yok', 'Kutulara koyduğun hırdavatı, devre elemanını ya da aletini eklemek için Ekle sekmesine git.');
    return renderEmptyState('search', 'Aramaya başla', 'Parça adı, açıklaması, etiketi veya kutu adına göre anında bulursun.');
  }
  const boxById = getBoxById();
  const results = state.items.filter(it => {
    const box = boxById[it.box_id];
    const tags = it.tags || [];
    const matchesText = !q ||
      it.name.toLocaleLowerCase('tr').includes(q) ||
      (it.description || '').toLocaleLowerCase('tr').includes(q) ||
      (box && box.name.toLocaleLowerCase('tr').includes(q)) ||
      tags.some(t => t.toLocaleLowerCase('tr').includes(q));
    const matchesTag = !hasTagFilter || tags.indexOf(state.activeTagFilter) !== -1;
    return matchesText && matchesTag;
  }).sort((a, b) => tsVal(b) - tsVal(a));
  if (results.length === 0) return renderEmptyState('search', 'Sonuç bulunamadı', hasTagFilter ? '"' + state.activeTagFilter + '" etiketiyle eşleşen parça yok.' : '"' + currentQuery + '" için eşleşen parça yok.');
  return results.map(it => renderItemRow(it, boxById[it.box_id])).join('');
}

}

  currentQuery = '';
  const input = document.getElementById('search-input');
  if (input) input.value = '';
  document.getElementById('search-results').innerHTML = computeSearchResultsHtml();
  const btn = document.getElementById('search-clear-btn');
  if (btn) btn.style.display = 'none';
  if (input) input.focus();
}

function renderTagSuggestions() {

function addFormTagFromSuggestion(idx) {

function refreshTagAreas() {

function handleTagEntryKeydown(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    let val = e.target.value.trim();
    if (val.charAt(val.length - 1) === ',') val = val.slice(0, -1).trim();
    if (val && state.formTags.indexOf(val) === -1) {
      state.formTags.push(val);
      refreshTagAreas();
    }
    e.target.value = '';
  } else if (e.key === 'Backspace' && e.target.value === '' && state.formTags.length > 0) {
    state.formTags.pop();
    refreshTagAreas();
  }
}
function removeFormTagAt(idx) {

async function adjustItemQuantity(delta) {
  const idx = state.items.findIndex(i => i.id === state.detailItemId);
  if (idx === -1) return;
  const current = (state.items[idx].quantity !== undefined && state.items[idx].quantity !== null) ? state.items[idx].quantity : 1;
  const next = Math.max(0, current + delta);
  if (next === current) return;
  const display = document.getElementById('detail-qty-display');
  if (display) display.textContent = next;
  try {
    const saved = await DB.updateItem(state.items[idx].id, { quantity: next });
    state.items[idx] = saved;
  } catch (err) {
    console.error(err);
    if (display) display.textContent = current;
    showToast('Güncellenemedi, tekrar dene');
  }
}

async function openDetail(id) {

async function exportData() {
  showToast('Yedek hazırlanıyor…');
  try {
    const itemsFull = [];
    for (const it of state.items) {
      let photoBase64 = null, photoMime = null;
      if (it.photo_mime) {
        const full = await DB.getItemWithPhoto(it.id);
        if (full && full.photo) { photoBase64 = bytesToBase64(hexPgToBytes(full.photo)); photoMime = full.photo_mime; }
      }
      itemsFull.push({ id: it.id, name: it.name, description: it.description || '', box_id: it.box_id, created_at: it.created_at, photo_base64: photoBase64, photo_mime: photoMime, quantity: (it.quantity !== undefined && it.quantity !== null) ? it.quantity : 1, tags: it.tags || [] });
    }
    const payload = { exportedAt: new Date().toISOString(), boxes: state.boxes, items: itemsFull };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'atolye-envanteri-yedek-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Yedek indirildi');
  } catch (err) { console.error(err); showToast('Yedek oluşturulamadı'); }
}
function triggerImport() { document.getElementById('import-file-input').click(); }
async function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const payload = JSON.parse(text);
    if (!payload || !Array.isArray(payload.boxes) || !Array.isArray(payload.items)) throw new Error('format');
    const idMap = {};
    for (const b of payload.boxes) {
      const box = await DB.addBox(b.name, b.color_idx || 0);
      idMap[b.id] = box.id; state.boxes.push(box);
    }
    for (const it of payload.items) {
      const data = { name: it.name, description: it.description || '', box_id: idMap[it.box_id] || it.box_id, quantity: (it.quantity !== undefined && it.quantity !== null) ? it.quantity : 1, tags: it.tags || [] };
      if (it.photo_base64) { data.photo = bytesToHexPg(base64ToBytes(it.photo_base64)); data.photo_mime = it.photo_mime || 'image/jpeg'; }
      const saved = await DB.addItem(data);
      state.items.push(saved);
    }
    showToast('İçe aktarma tamamlandı');
    refreshHeader(); refreshTabContent();
  } catch (err) { console.error(err); showToast('Dosya okunamadı ya da format hatalı'); }
  e.target.value = '';
}

function toggleAuthMode() { state.authMode = state.authMode === 'signin' ? 'signup' : 'signin'; state.authError = ''; render(); }
function friendlyAuthError(err) {
  const raw = ((err && (err.error_description || err.msg || err.error || err.message)) || '') + '';
  const low = raw.toLowerCase();
  if (low.indexOf('invalid') !== -1 && (low.indexOf('credential') !== -1 || low.indexOf('login') !== -1)) return 'E-posta veya şifre hatalı.';
  if (low.indexOf('already') !== -1) return 'Bu e-posta zaten kayıtlı, giriş yapmayı dene.';
  if (low.indexOf('password') !== -1) return 'Şifre en az 6 karakter olmalı.';
  if (low.indexOf('email') !== -1 && low.indexOf('invalid') !== -1) return 'Geçersiz e-posta adresi.';
  if (low.indexOf('rate') !== -1 || low.indexOf('too many') !== -1) return 'Çok fazla deneme yapıldı, biraz sonra tekrar dene.';
  return 'Bir şeyler ters gitti, tekrar dene.';
}
async function handleAuthSubmit(e) {
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const rememberEl = document.getElementById('remember-me');
  const remember = rememberEl ? rememberEl.checked : true;
  state.rememberMe = remember;
  state.authBusy = true; state.authError = '';
  render();
  try {
    if (state.authMode === 'signup') {
      const data = await signUp(email, password);
      if (data && data.access_token) {
        session = data;
        if (remember) saveRememberedToken(data.refresh_token); else clearRememberedToken();
        await onLoggedIn(data.user);
      }
      else {
        state.authBusy = false; state.authMode = 'signin';
        state.authError = 'Hesap oluşturuldu. E-postana gelen onay bağlantısına tıkladıktan sonra giriş yapabilirsin.';
        render();
      }
    } else {
      const data = await signIn(email, password);
      session = data;
      if (remember) saveRememberedToken(data.refresh_token); else clearRememberedToken();
      await onLoggedIn(data.user);
    }
  } catch (err) {
    state.authBusy = false; state.authError = friendlyAuthError(err);
    render();
  }
}
async function onLoggedIn(user) {
  state.user = user;
  document.getElementById('app').innerHTML = '<div class="loading-screen">Yükleniyor…</div>';
  await loadAll();
  render();
}
async function handleSignOut() {
  await signOutRemote().catch(() => {});
  session = null;
  clearRememberedToken();
  state.user = null; state.boxes = []; state.items = [];
  state.tab = 'search'; state.activeBoxId = null; state.detailItemId = null; state.editingItemId = null;
  render();
}

/* ================= BAŞLANGIÇ ================= */

document.getElementById('app').innerHTML = '<div class="loading-screen">Yükleniyor…</div>';
const configReady = SUPABASE_URL.indexOf('BURAYA') === -1 && SUPABASE_ANON_KEY.indexOf('BURAYA') === -1;
if (!configReady) {
  document.getElementById('app').innerHTML =
    '<div class="auth-wrap"><div class="auth-card">' +
    '<div class="icon-badge" style="margin:0 auto 14px">' + icon('box', 20) + '</div>' +
    '<div class="auth-title">Kurulum gerekiyor</div>' +
    '<div class="auth-sub">Bu dosyanın en üstündeki <code>SUPABASE_URL</code> ve <code>SUPABASE_ANON_KEY</code> alanlarını kendi Supabase projenin bilgileriyle doldurman gerekiyor. Ayrıntılar için sohbetteki kurulum adımlarına bak.</div>' +
    '</div></div>';
} else {
  (async function boot() {
    const stored = getRememberedToken();
    if (stored) {
      document.getElementById('app').innerHTML = '<div class="loading-screen">Oturum açılıyor…</div>';
      try {
        const data = await authRequest('/token?grant_type=refresh_token', { refresh_token: stored });
        session = data;
        saveRememberedToken(data.refresh_token);
        await onLoggedIn(data.user);
        return;
      } catch (err) {
        console.error(err);
        clearRememberedToken();
      }
    }
    render();
  })();
}
</script>
